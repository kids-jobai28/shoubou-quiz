<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消防設備士 資格試験クイズ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root {
  --font-sans: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  --surface-1: #f4f4f5;
  --surface-2: #ffffff;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --border-stronger: #a1a1aa;
  --border-accent: #6366f1;
  --border-success: #22c55e;
  --border-danger: #ef4444;
  --text-primary: #18181b;
  --text-secondary: #52525b;
  --text-muted: #a1a1aa;
  --text-accent: #4f46e5;
  --text-success: #16a34a;
  --text-danger: #dc2626;
  --bg-accent: #eef2ff;
  --bg-success: #f0fdf4;
  --bg-danger: #fef2f2;
  --fill-danger: #ef4444;
  --fill-accent: #6366f1;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: #f6f6f8;
  color: var(--text-primary);
  min-height: 100vh;
  padding: 0.75rem;
}
.container { max-width: 640px; margin: 0 auto; padding: 0.75rem 0; }
h1 { font-size: 19px; font-weight: 700; color: var(--text-primary); margin-bottom: 0.2rem; }
.subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 1.25rem; }

/* ゾーンタブ */
.zone-tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.ztab { padding: 8px 18px; border: 1.5px solid var(--border-strong); border-radius: 24px; background: var(--surface-2); color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.18s; min-height: 40px; }
.ztab:hover { background: var(--surface-1); }
.ztab.active-free { background: var(--bg-success); border-color: var(--border-success); color: var(--text-success); }
.ztab.active-paid { background: var(--bg-accent); border-color: var(--border-accent); color: var(--text-accent); }

/* 類タブ */
.type-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.ttab { padding: 7px 13px; border: 1.5px solid var(--border); border-radius: 18px; background: var(--surface-2); color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all 0.18s; min-height: 36px; }
.ttab:hover { background: var(--surface-1); }
.ttab.active { background: var(--bg-danger); border-color: var(--border-danger); color: var(--text-danger); font-weight: 600; }
.ttab.unlocked { border-color: var(--border-accent); }
.ttab.unlocked.active { background: var(--bg-accent); border-color: var(--border-accent); color: var(--text-accent); font-weight: 600; }

/* カテゴリフィルター */
.cat-filter { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 0.85rem; }
.cf-btn { padding: 5px 11px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-1); color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all 0.15s; min-height: 30px; }
.cf-btn:hover { background: var(--surface-2); }
.cf-btn.active { background: #fdf4ff; border-color: #c026d3; color: #a21caf; font-weight: 600; }

/* プログレスバー */
.prog-bar { height: 5px; background: var(--surface-1); border-radius: 3px; margin-bottom: 1rem; overflow: hidden; }
.prog-fill { height: 100%; background: var(--fill-danger); border-radius: 3px; transition: width 0.35s ease; }
.prog-fill.paid { background: var(--fill-accent); }

/* メタ行 */
.meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; gap: 6px; flex-wrap: wrap; }
.meta-l { font-size: 12px; color: var(--text-muted); }
.score-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
.score-free { background: var(--bg-danger); color: var(--text-danger); }
.score-paid { background: var(--bg-accent); color: var(--text-accent); }
.meta-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* 問題カード */
.q-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 0.85rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: box-shadow 0.2s; }
.q-card.correct-anim { animation: flashCorrect 0.45s ease; }
.q-card.wrong-anim { animation: flashWrong 0.45s ease; }
@keyframes flashCorrect { 0%{background:#dcfce7} 100%{background:white} }
@keyframes flashWrong   { 0%{background:#fee2e2} 100%{background:white} }
.tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 0.6rem; align-items: center; }
.cat-tag { font-size: 11px; color: var(--text-secondary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; }
.type-tag { font-size: 11px; color: var(--text-accent); background: var(--bg-accent); border: 1px solid var(--border-accent); border-radius: 4px; padding: 2px 8px; }
.weak-tag { font-size: 11px; color: #b45309; background: #fffbeb; border: 1px solid #fbbf24; border-radius: 4px; padding: 2px 8px; }
.q-text { font-size: 15px; color: var(--text-primary); line-height: 1.65; margin: 0; }

/* 選択肢 */
.choices { display: flex; flex-direction: column; gap: 9px; margin-top: 1rem; }
.c-btn {
  text-align: left; padding: 12px 15px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-primary);
  font-size: 14px; cursor: pointer;
  transition: all 0.15s; line-height: 1.5;
  font-family: var(--font-sans);
  min-height: 48px;
  position: relative;
}
.c-btn:hover:not(:disabled) { background: var(--surface-1); border-color: var(--border-stronger); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
.c-btn.correct { background: var(--bg-success); border-color: var(--border-success); color: var(--text-success); font-weight: 600; }
.c-btn.wrong   { background: var(--bg-danger);  border-color: var(--border-danger);  color: var(--text-danger); }
.c-btn:disabled { cursor: default; transform: none; box-shadow: none; }
.c-btn .c-mark { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; }

/* 解説 */
.exp-box { margin-top: 1rem; padding: 13px 15px; background: #f8f8ff; border-left: 3px solid var(--border-accent); border-radius: 0 var(--radius) var(--radius) 0; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

/* note誘導 */
.note-cta { margin-top: 0.85rem; padding: 12px 14px; background: linear-gradient(135deg,#eef2ff,#f5f3ff); border: 1px solid var(--border-accent); border-radius: var(--radius); font-size: 13px; color: var(--text-accent); display: flex; align-items: center; gap: 8px; }
.note-link { color: var(--text-accent); font-weight: 600; text-decoration: underline; }

/* ナビ */
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.85rem; gap: 8px; }
.nav-btn { padding: 11px 22px; border: 1.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-1); color: var(--text-primary); font-size: 14px; cursor: pointer; font-family: var(--font-sans); font-weight: 500; transition: all 0.15s; min-height: 44px; }
.nav-btn:hover:not(:disabled) { background: var(--surface-2); }
.nav-btn:disabled { opacity: 0.4; cursor: default; }
.nav-btn.primary-free { background: var(--fill-danger); border-color: var(--fill-danger); color: white; }
.nav-btn.primary-free:hover { background: #dc2626; }
.nav-btn.primary-paid { background: var(--fill-accent); border-color: var(--fill-accent); color: white; }
.nav-btn.primary-paid:hover { background: #4338ca; }

/* パスワードカード */
.pw-card { background: var(--surface-2); border: 1px solid var(--border-accent); border-radius: 16px; padding: 1.75rem 1.25rem; margin-bottom: 1rem; text-align: center; box-shadow: 0 2px 12px rgba(99,102,241,0.1); }
.pw-icon { font-size: 36px; margin-bottom: 0.5rem; }
.pw-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin: 0 0 0.5rem; }
.pw-sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 1.25rem; line-height: 1.65; }
.pw-note-btn { display: inline-block; margin-bottom: 1.25rem; padding: 10px 22px; background: #41c9b4; color: white; border-radius: 20px; font-size: 14px; font-weight: 600; text-decoration: none; transition: opacity 0.15s; }
.pw-note-btn:hover { opacity: 0.85; }
.pw-input-row { display: flex; gap: 8px; max-width: 360px; margin: 0 auto; }
.pw-input-row input { flex: 1; font-size: 15px; padding: 10px 13px; border: 1.5px solid var(--border-strong); border-radius: var(--radius); font-family: var(--font-sans); min-height: 44px; }
.pw-input-row button { padding: 10px 18px; background: var(--fill-accent); color: white; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-sans); min-height: 44px; }
.pw-err { font-size: 12px; color: var(--text-danger); margin-top: 0.5rem; }
.pw-hint { margin-top: 1rem; font-size: 11px; color: var(--text-muted); }

/* 解放済みバナー */
.unlocked-banner { background: var(--bg-success); border: 1px solid var(--border-success); border-radius: var(--radius); padding: 9px 14px; font-size: 13px; color: var(--text-success); font-weight: 500; display: flex; align-items: center; gap: 6px; margin-bottom: 1rem; }

/* 苦手リスト */
.weak-bar { background: #fffbeb; border: 1px solid #fbbf24; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 0.85rem; }
.weak-bar-title { font-size: 12px; font-weight: 600; color: #92400e; margin-bottom: 6px; }
.weak-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.weak-chip { font-size: 11px; background: #fef3c7; border: 1px solid #fbbf24; border-radius: 10px; padding: 2px 9px; color: #78350f; cursor: pointer; transition: background 0.15s; }
.weak-chip:hover { background: #fde68a; }
.weak-chip.retry { background: #f59e0b; color: white; border-color: #f59e0b; }

/* 正答率グラフ */
.stats-panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.1rem 0.8rem; margin-bottom: 1rem; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
.stats-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.75rem; }
.stats-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.stats-label { font-size: 12px; color: var(--text-secondary); width: 80px; flex-shrink: 0; }
.stats-track { flex: 1; height: 8px; background: var(--surface-1); border-radius: 4px; overflow: hidden; }
.stats-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.stats-val { font-size: 11px; color: var(--text-muted); width: 36px; text-align: right; flex-shrink: 0; }

/* 結果画面 */
.result-wrap { text-align: center; padding: 1.25rem 0.5rem; }
.result-circle { width: 110px; height: 110px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 0.85rem; }
.result-circle.free { background: var(--bg-danger); border: 3px solid var(--border-danger); }
.result-circle.paid { background: var(--bg-accent); border: 3px solid var(--border-accent); }
.result-num { font-size: 36px; font-weight: 700; line-height: 1; }
.result-num.free { color: var(--text-danger); }
.result-num.paid { color: var(--text-accent); }
.result-pct { font-size: 13px; font-weight: 500; }
.result-pct.free { color: var(--text-danger); }
.result-pct.paid { color: var(--text-accent); }
.result-lbl { font-size: 13px; color: var(--text-secondary); margin-bottom: 0.5rem; }
.result-msg { font-size: 14px; color: var(--text-primary); margin-bottom: 1.25rem; line-height: 1.6; }
.result-cta { border-radius: 12px; padding: 1rem 1.1rem; text-align: left; margin-bottom: 0.75rem; }
.result-cta.free { background: var(--bg-danger); border: 1px solid var(--border-danger); }
.result-cta.paid { background: var(--bg-accent); border: 1px solid var(--border-accent); }
.result-cta-title { font-size: 13px; font-weight: 600; margin-bottom: 0.5rem; }
.result-cta-title.free { color: var(--text-danger); }
.result-cta-title.paid { color: var(--text-accent); }
.result-link { font-size: 13px; color: var(--text-accent); text-decoration: underline; cursor: pointer; display: block; margin: 4px 0; }
.result-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
.result-weak-btn { padding: 10px 18px; background: #fffbeb; border: 1.5px solid #fbbf24; border-radius: var(--radius); color: #92400e; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-sans); min-height: 44px; transition: background 0.15s; }
.result-weak-btn:hover { background: #fef3c7; }

/* ランダムボタン */
.rand-btn { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 5px 12px; font-size: 12px; color: var(--text-secondary); cursor: pointer; transition: all .18s; white-space: nowrap; min-height: 30px; }
.rand-btn:hover { background: var(--surface-2); }
.rand-btn.rand-on { background: #f5f3ff; border-color: #7c3aed; color: #7c3aed; font-weight: 600; }

/* レスポンシブ */
@media (max-width: 480px) {
  body { padding: 0.5rem; }
  .container { padding: 0.5rem 0; }
  h1 { font-size: 17px; }
  .ztab { padding: 7px 14px; font-size: 13px; }
  .ttab { padding: 6px 10px; font-size: 12px; }
  .q-text { font-size: 14px; }
  .c-btn { font-size: 13px; padding: 11px 13px; }
  .nav-btn { padding: 10px 16px; font-size: 13px; }
  .result-circle { width: 95px; height: 95px; }
  .result-num { font-size: 30px; }
  .stats-label { width: 68px; font-size: 11px; }
}
</style>
</head>

    {cat:"法令", type:"", q:"消火器の設置高さとして正しいものはどれか？", choices:["床面からの高さが0.5m以下","床面からの高さが1.0m以下","床面からの高さが1.5m以下","高さの制限はない"], ans:2, exp:"消火器は床面からの高さが1.5m以下の場所に設置します。"},
    {cat:"法令", type:"", q:"消火器の設置場所の表示として正しいものはどれか？", choices:["白地に赤文字で「消火器」と表示","赤地に白文字で「消火器」と表示","緑地に白文字で「消火器」と表示","黄地に黒文字で「消火器」と表示"], ans:1, exp:"消火器の標識は赤地に白文字で「消火器」と表示します。見やすい位置に設置する必要があります。"},

    {cat:"構造・機能", type:"", q:"泡消火器が適応しない火災として正しいものはどれか？", choices:["A火災（普通火災）","B火災（油火災）","C火災（電気火災）","A火災とB火災の両方"], ans:2, exp:"泡消火器は電気伝導性があるためC火災（電気火災）には適応しません。A火災・B火災に有効です。"},
    {cat:"構造・機能", type:"", q:"ハロゲン化物消火器の消火効果として主なものはどれか？", choices:["冷却効果","窒息効果","抑制効果（負触媒効果）","浸透効果"], ans:2, exp:"ハロゲン化物消火器の主な消火効果は抑制効果（負触媒効果）です。燃焼の連鎖反応を断ち切ります。"},
    {cat:"構造・機能", type:"", q:"消火器の加圧方式のうち「蓄圧式」の説明として正しいものはどれか？", choices:["使用時に加圧用ガス容器のガスで加圧する","常時容器内に窒素ガスまたは空気が充填されている","手動ポンプで加圧する","化学反応で発生したガスで加圧する"], ans:1, exp:"蓄圧式は常時容器内に窒素ガスまたは空気（加圧ガス）が充填されており、指示圧力計が付いています。"},
    {cat:"構造・機能", type:"", q:"消火器の加圧方式のうち「ガス加圧式」の説明として正しいものはどれか？", choices:["常時容器内にガスが充填されている","使用時に加圧用ガス容器（ボンベ）のガスで加圧する","手動ポンプで加圧する","化学反応で発生したガスで加圧する"], ans:1, exp:"ガス加圧式は使用時にカッターで加圧用ガス容器（CO₂ボンベ）を開放してガスで加圧します。指示圧力計はありません。"},
    {cat:"構造・機能", type:"", q:"消火器の指示圧力計が緑色範囲を示しているとき、何を意味するか？", choices:["消火薬剤が少ない","使用可能な圧力範囲にある","圧力が高すぎる","点検が必要な状態"], ans:1, exp:"指示圧力計の緑色範囲（0.7〜0.98MPa）は使用可能な適正圧力範囲を示します。緑色範囲外は点検・整備が必要です。"},
    {cat:"構造・機能", type:"", q:"消火器のホースの省略が認められる消火器として正しいものはどれか？", choices:["消火薬剤量が3kg（または3L）以下の小型消火器","二酸化炭素消火器（全て）","能力単位が1の消火器","住宅用消火器"], ans:0, exp:"消火薬剤量が3kg（粉末）または3L（液体）以下の小型消火器はホースの省略が認められています。ハロゲン化物消火器も同様の基準があります。"},
    {cat:"構造・機能", type:"", q:"水消火器の主な消火効果として正しいものはどれか？", choices:["抑制効果（負触媒効果）","窒息効果のみ","冷却効果と浸透・希釈効果","冷却効果と窒息効果"], ans:2, exp:"水消火器の主な消火効果は冷却効果と浸透・希釈効果です。A火災（普通火災）に有効ですが、B・C火災には適応しません。"},
    {cat:"構造・機能", type:"", q:"粉末消火器（BC粉末）の主成分として正しいものはどれか？", choices:["第三リン酸アンモニウム","炭酸水素ナトリウム","炭酸カリウム","塩化ナトリウム"], ans:1, exp:"BC粉末消火器の主成分は炭酸水素ナトリウム（重炭酸ソーダ）です。ABC粉末はリン酸アンモニウムが主成分です。"},

    {cat:"実技", type:"", q:"加圧式消火器のレバーを握っても放射されない場合の原因として最も考えられるものはどれか？", choices:["消火薬剤が固まっている","加圧用ガス容器が未開封","安全栓が抜かれていない","ホースが詰まっている"], ans:2, exp:"レバーを握っても放射されない最も多い原因は安全栓が抜かれていないことです。まず安全栓を確認します。"},
    {cat:"実技", type:"", q:"消火器の放射後の処置として正しいものはどれか？", choices:["そのまま元の場所に戻す","消防署に報告する","速やかに再充填または新品と交換する","廃棄して新品を購入する"], ans:2, exp:"消火器を放射した後は速やかに再充填（加圧式）または新品と交換（蓄圧式の一部）する必要があります。"},
    {cat:"実技", type:"", q:"消火器の本体容器の耐圧試験で不合格となる場合はどれか？", choices:["表面に小さなキズがある","試験圧力で漏れや著しい変形がある","塗装が一部剥がれている","ラベルが汚れている"], ans:1, exp:"耐圧試験では試験圧力（最高使用圧力の1.5倍）において漏れや著しい変形がある場合は不合格となります。"},
    {cat:"規格", type:"", q:"消火器の能力単位の表示として正しいものはどれか？", choices:["A火災・B火災・C火災の全てに対して表示","A火災とB火災のみ表示（C火災は適応するだけ）","C火災のみ表示","能力単位の表示義務はない"], ans:1, exp:"能力単位はA火災（普通火災）とB火災（油火災）に対して表示します。C火災（電気火災）は適応可否のみ表示します。"},
    {cat:"規格", type:"", q:"消火器の使用温度範囲として正しいものはどれか（標準的な粉末消火器）？", choices:["-10℃以上40℃以下","-20℃以上40℃以下","0℃以上40℃以下","5℃以上40℃以下"], ans:1, exp:"標準的な粉末消火器の使用温度範囲は-20℃以上40℃以下です。"},

    {cat:"規格", type:"", q:"住宅用消火器と業務用消火器の違いとして正しいものはどれか？", choices:["住宅用は検定が不要","住宅用は能力単位の表示がない","住宅用は消防法の設置義務対象外の住宅向けで型式承認が異なる","住宅用は再充填できる"], ans:2, exp:"住宅用消火器は消防法の設置義務対象外の一般住宅向けで、業務用と型式承認区分が異なります。能力単位の表示はなく、再充填不可のものが多いです。"},
    {cat:"規格", type:"", q:"消火器の総質量として正しいものはどれか（小型消火器の上限）？", choices:["10kg以下","15kg以下","20kg以下","25kg以下"], ans:1, exp:"小型消火器の総質量は15kg以下（一部例外あり）と定められています。15kgを超えるものは大型消火器に分類されます。"},

    {cat:"規格", type:"", q:"消火器の検定について正しいものはどれか？", choices:["都道府県知事が行う","日本消防検定協会または指定検定機関が行う","消防庁長官が行う","製造者が自主検定する"], ans:1, exp:"消火器の検定は日本消防検定協会または総務大臣が指定する指定検定機関が行います。"},
    {cat:"規格", type:"", q:"消火器の廃棄時期の目安として正しいものはどれか？", choices:["製造から5年","製造から8年","製造から10年","永続的に使用可能"], ans:2, exp:"消火器の廃棄時期の目安は製造から概ね10年です。ただし腐食・変形・損傷がある場合は直ちに廃棄します。"},
    {cat:"規格", type:"", q:"大型消火器の能力単位として正しいものはどれか？", choices:["A火災10以上またはB火災20以上","A火災5以上またはB火災10以上","A火災20以上またはB火災40以上","A火災3以上またはB火災5以上"], ans:0, exp:"大型消火器はA火災の能力単位が10以上、またはB火災の能力単位が20以上のものをいいます。"},
    {cat:"法令", type:"", q:"消火器の設置が必要な無窓階の床面積として正しいものはどれか？", choices:["床面積25㎡以上","床面積50㎡以上","床面積100㎡以上","床面積150㎡以上"], ans:1, exp:"無窓階（地階を除く）は床面積50㎡以上の場合に消火器の設置が義務付けられます。"},

    {cat:"構造・機能", type:"", q:"化学泡消火器の消火原理として正しいものはどれか？", choices:["負触媒効果のみ","冷却効果と窒息効果","窒息効果と抑制効果","浸透効果のみ"], ans:1, exp:"化学泡消火器はA剤（炭酸水素ナトリウム）とB剤（硫酸アルミニウム）の化学反応で発生する泡による窒息効果と冷却効果で消火します。"},
    {cat:"構造・機能", type:"", q:"強化液消火器が適応する火災として正しいものはどれか？", choices:["A火災のみ","A火災・B火災・C火災","A火災・B火災","B火災・C火災"], ans:1, exp:"強化液消火器（霧状放射）はA火災・B火災・C火災のすべてに適応します。棒状放射のものはA火災のみです。"},
    {cat:"構造・機能", type:"", q:"消火器の放射距離として正しいものはどれか（粉末消火器・小型）？", choices:["1m〜2m","3m〜5m","5m〜8m","8m〜10m"], ans:1, exp:"小型粉末消火器の放射距離は概ね3〜5mです。大型は約5〜8mです。"},
    {cat:"構造・機能", type:"", q:"二酸化炭素消火器が適応しない火災として正しいものはどれか？", choices:["B火災（油火災）","C火災（電気火災）","A火災（普通火災）","B火災とC火災の両方"], ans:2, exp:"CO₂消火器はA火災（普通火災）には有効性が低く一般的には適応しません。B火災・C火災に有効です。"},
    {cat:"構造・機能", type:"", q:"消火器の本体容器の材質として正しいものはどれか？", choices:["木製","鋼板またはアルミニウム合金など","ガラス製","プラスチック製（全て）"], ans:1, exp:"消火器の本体容器には鋼板・ステンレス鋼板・アルミニウム合金・FRP等が使用されます。"},
    {cat:"実技", type:"", q:"消火器の内部点検で確認する消火薬剤の状態として正しいものはどれか？", choices:["重量のみ確認","固化・変色・異臭などを確認","色のみ確認","製造年のみ確認"], ans:1, exp:"内部点検では消火薬剤の固化・ケーキング・変色・変質・異臭の有無などを確認します。"},
    {cat:"実技", type:"", q:"消火器のガス加圧式の機能点検で行う操作として正しいものはどれか？", choices:["圧力計の確認のみ","加圧用ガス容器の重量測定による薬剤量確認","ガスを放出して確認","ホース先端からの放射試験"], ans:1, exp:"ガス加圧式消火器の機能点検では加圧用ガス容器（CO₂ボンベ）を取り外して重量を測定し、規定量以上あることを確認します。"},
    {cat:"実技", type:"", q:"消火器の点検後の措置として正しいものはどれか？", choices:["異常がある場合でも次回点検まで使用継続","異常がある場合は直ちに整備・交換する","異常があっても報告書に記載するだけでよい","異常は消防署に全て報告する"], ans:1, exp:"点検で異常が発見された場合は直ちに整備または交換します。不良品をそのまま放置してはなりません。"},

    {cat:"規格", type:"", q:"消火器の安全栓の材質として正しいものはどれか？", choices:["鉄製","ステンレス製または黄銅製","アルミニウム製","プラスチック製"], ans:1, exp:"安全栓はステンレス鋼や黄銅（真鍮）などの腐食しにくい金属製です。引き抜きやすい形状とされています。"},
    {cat:"規格", type:"", q:"消火器の本体容器への表示として義務付けられていないものはどれか？", choices:["型式番号","製造年","充填圧力（蓄圧式）","消火器の所有者名"], ans:3, exp:"消火器への表示義務事項は型式番号・製造年・充填圧力（蓄圧式）・消火薬剤の種類・充填量・使用方法等です。所有者名は義務ではありません。"},
    {cat:"規格", type:"", q:"消火器の塗色として正しいものはどれか？", choices:["全面を赤色にしなければならない","容器の25%以上を赤色にしなければならない","容器の全面を白色にし赤い帯を巻く","色の規定はない"], ans:1, exp:"消火器の容器は容量部分の25%以上を赤色に塗装しなければなりません（住宅用消火器を除く）。"},

    {cat:"法令", type:"", q:"消火器の設置免除が認められる場合として正しいものはどれか？", choices:["自動火災報知設備が設置されている場合は全て免除","屋内消火栓設備が設置されている部分は設置個数の1/3を減らせる","泡消火設備が設置されている部分は1/3を減らせる","設置免除の規定はない"], ans:1, exp:"屋内消火栓設備が設置されている部分は消火器の設置個数を1/3減少できます（スプリンクラー等は1/2減少）。"},
    {cat:"構造・機能", type:"", q:"消火器のノズルの種類として正しいものはどれか？", choices:["棒状ノズルのみ","霧状ノズルのみ","棒状・霧状・両用など種類がある","業務用は全て棒状"], ans:2, exp:"消火器のノズルには棒状・霧状・棒状と霧状の切り替え式など複数の種類があります。薬剤の種類や用途により使い分けます。"},
    {cat:"実技", type:"", q:"消火器の外観点検で安全栓の封印（シール）が破れていた場合の措置として正しいものはどれか？", choices:["そのまま使用継続","消防署に報告する","使用済み・いたずらの疑いがあるため内部点検を実施","廃棄する"], ans:2, exp:"封印が破れている場合は使用済みまたはいたずらの疑いがあるため、内部点検を実施して消火薬剤量・加圧ガス量を確認します。"},
    {cat:"実技", type:"", q:"消火器の耐圧性能試験（水圧試験）を行う必要がある場合として正しいものはどれか？", choices:["製造から3年経過したもの全て","製造から10年を経過したもの、または腐食等がある場合","毎年実施する","蓄圧式のみ毎回実施する"], ans:1, exp:"製造から10年を経過した消火器、または腐食・変形・損傷等が認められる場合には耐圧性能試験（水圧試験）を実施します。"},
    {cat:"規格", type:"", q:"消火器の操作方法の表示について正しいものはどれか？", choices:["口頭説明のみでよい","本体容器に分かりやすく表示する義務がある","メーカーのウェブサイトで確認できればよい","QRコードで案内すればよい"], ans:1, exp:"消火器の本体容器には使用方法（操作手順）をイラストや文字で分かりやすく表示することが義務付けられています。"},

  "甲4・乙7": [
    {cat:"法令", type:"甲4", q:"自動火災報知設備の設置が必要な延べ面積として正しいものはどれか（飲食店の場合）？", choices:["100㎡以上","150㎡以上","200㎡以上","300㎡以上"], ans:1, exp:"飲食店（令別表第1(3)項）は延べ面積150㎡以上で自動火災報知設備の設置義務が生じます。"},
    {cat:"法令", type:"甲4", q:"自動火災報知設備の警戒区域の面積の原則として正しいものはどれか？", choices:["300㎡以下","500㎡以下","600㎡以下","1000㎡以下"], ans:2, exp:"警戒区域の面積は原則として600㎡以下で、一辺の長さが50m以下とされています。"},
    {cat:"法令", type:"甲4", q:"自動火災報知設備の警戒区域の一辺の長さの原則として正しいものはどれか？", choices:["30m以下","40m以下","50m以下","60m以下"], ans:2, exp:"警戒区域の一辺の長さは原則として50m以下です。ただし光電式分離型感知器を使用する場合は100m以下です。"},
    {cat:"法令", type:"甲4", q:"感知器の設置が免除される場所として正しいものはどれか？", choices:["機械室","浴室","廊下","地下室"], ans:1, exp:"水蒸気が多量に滞留する浴室などは感知器の設置が免除されます。"},
    {cat:"法令", type:"甲4", q:"煙感知器の設置が義務付けられる場所として正しいものはどれか？", choices:["ボイラー室","廊下・通路・階段","厨房","駐車場"], ans:1, exp:"廊下・通路・階段などの避難経路には煙感知器（光電式または光電アナログ式）の設置が義務付けられています。"},
    {cat:"法令", type:"甲4", q:"自動火災報知設備の受信機の設置場所として正しいものはどれか？", choices:["最上階","防災センター等常時人がいる場所","屋外","地下機械室"], ans:1, exp:"受信機は防災センター等常時人がいる場所または管理人室等に設置します。"},
    {cat:"法令", type:"甲4", q:"P型1級受信機の回線数の上限として正しいものはどれか？", choices:["5回線以下","10回線以下","制限なし","50回線以下"], ans:2, exp:"P型1級受信機の回線数に制限はありません。P型2級受信機は5回線以下、P型3級は1回線です。"},
    {cat:"法令", type:"甲4", q:"自動火災報知設備の非常電源の容量として正しいものはどれか？", choices:["10分以上監視できる容量","30分以上監視できる容量","60分以上監視できる容量","120分以上監視できる容量"], ans:1, exp:"自動火災報知設備の非常電源は30分以上監視状態を継続できる容量が必要です。"},
    {cat:"構造・機能", type:"甲4", q:"差動式スポット型感知器が作動する原理として正しいものはどれか？", choices:["一定温度に達したとき","温度上昇率が一定値以上になったとき","煙濃度が一定値以上になったとき","炎の紫外線を検知したとき"], ans:1, exp:"差動式は温度の上昇率が一定値以上になったときに作動します。定温式は一定温度に達したときです。"},
    {cat:"構造・機能", type:"甲4", q:"定温式スポット型感知器の特種・1種・2種の違いとして正しいものはどれか？", choices:["作動温度の違い","感度（応答時間）の違い","設置高さの違い","形状の違い"], ans:1, exp:"定温式スポット型感知器の特種・1種・2種は感度（応答時間）の違いです。特種が最も感度が高く（応答時間が短い）、2種が最も低いです。"},
    {cat:"構造・機能", type:"甲4", q:"光電式スポット型感知器の作動原理として正しいものはどれか？", choices:["熱による膨張を検知","煙による光の散乱または遮光を検知","炎の紫外線を検知","イオン電流の変化を検知"], ans:1, exp:"光電式スポット型感知器は煙が入ると光が散乱（または遮断）されることを検知して作動します。"},
    {cat:"構造・機能", type:"甲4", q:"イオン化式スポット型感知器の作動原理として正しいものはどれか？", choices:["熱による膨張を検知","煙による光の散乱を検知","煙によるイオン電流の変化を検知","炎の紫外線を検知"], ans:2, exp:"イオン化式感知器は放射線源（アメリシウム241）によるイオン電流が煙によって変化することを検知します。"},
    {cat:"構造・機能", type:"甲4", q:"炎感知器の種類として正しいものはどれか？", choices:["紫外線式・赤外線式","熱式・煙式","差動式・定温式","光電式・イオン化式"], ans:0, exp:"炎感知器には紫外線式スポット型・赤外線式スポット型・紫外線赤外線併用式スポット型などがあります。"},
    {cat:"構造・機能", type:"甲4", q:"P型1級とP型2級受信機の主な違いとして正しいものはどれか？", choices:["蓄積機能の有無","地区音響装置の有無","導通試験機能の有無","火災表示試験機能の有無"], ans:2, exp:"P型1級受信機はP型2級にはない導通試験機能（配線の断線確認）を持ちます。"},
    {cat:"構造・機能", type:"甲4", q:"R型受信機の特徴として正しいものはどれか？", choices:["アナログ信号を使用する","固有の信号で各感知器・発信機を識別できる","回線数が5以下に限定される","蓄積機能がない"], ans:1, exp:"R型受信機は固有の信号（アドレス）で各感知器・発信機を個別に識別できます。P型は回線単位での識別です。"},
    {cat:"構造・機能", type:"甲4", q:"蓄積式受信機の機能として正しいものはどれか？", choices:["感知器が作動したら即座に警報を発する","感知器の作動信号を一定時間確認してから警報を発する","感知器の電源をバックアップする","感知器の感度を調整する"], ans:1, exp:"蓄積式受信機は感知器の作動信号を一定時間（5〜60秒）確認（蓄積）してから警報を発します。非火災報を防ぐ効果があります。"},
    {cat:"構造・機能", type:"甲4", q:"地区音響装置の音圧として正しいものはどれか？", choices:["取付け面から1mで70dB以上","取付け面から1mで90dB以上","取付け面から1mで65dB以上","取付け面から1mで75dB以上"], ans:0, exp:"地区音響装置の音圧は取付け面から1mの距離で70dB以上（音声警報装置は92dB以上）必要です。"},
    {cat:"構造・機能", type:"甲4", q:"発信機（P型1級）の設置距離として正しいものはどれか？", choices:["各部分から歩行距離15m以内","各部分から歩行距離25m以内","各部分から歩行距離50m以内","各部分から歩行距離100m以内"], ans:2, exp:"発信機は防火対象物の各部分から歩行距離50m以内ごとに設置します（1つの階に1個以上）。"},
    {cat:"構造・機能", type:"甲4", q:"光電式分離型感知器の公称監視距離として正しいものはどれか？", choices:["5m以上20m以下","5m以上100m以下","1m以上50m以下","10m以上200m以下"], ans:1, exp:"光電式分離型感知器の公称監視距離は5m以上100m以下です。送光部と受光部の間の距離に設置します。"},
    {cat:"構造・機能", type:"甲4", q:"差動式分布型感知器（空気管式）の構成として正しいものはどれか？", choices:["空気管と検出器（ダイヤフラム等）で構成","送光部と受光部で構成","熱電対と受信機で構成","イオン室と増幅器で構成"], ans:0, exp:"差動式分布型感知器（空気管式）は細い空気管と検出器（ダイヤフラムやリーク孔を含む）で構成されます。"},
    {cat:"実技", type:"甲4", q:"感知器の作動試験で使用する試験器として正しいものはどれか？", choices:["絶縁抵抗計（メガー）","加熱試験器または加煙試験器","電流計","電圧計"], ans:1, exp:"感知器の作動試験では熱感知器に加熱試験器、煙感知器に加煙試験器を使用して作動を確認します。"},
    {cat:"実技", type:"甲4", q:"自動火災報知設備の総合点検で確認する事項として正しいものはどれか？", choices:["受信機の外観確認のみ","感知器・発信機・受信機を実際に作動させて機能確認","配線の外観確認","電源電圧の確認のみ"], ans:1, exp:"総合点検では感知器・発信機・受信機・地区音響装置等を実際に作動させて総合的な機能を確認します。"},
    {cat:"実技", type:"甲4", q:"受信機の火災表示試験で確認する事項として正しいものはどれか？", choices:["実際に感知器を作動させて確認","試験スイッチを操作して火災表示・音響が正常か確認","配線の断線を確認","電源電圧を確認"], ans:1, exp:"火災表示試験は試験スイッチを操作して火災表示灯・地区表示灯の点灯および主音響・地区音響の鳴動を確認します。"},
    {cat:"実技", type:"甲4", q:"感知器の設置場所で天井が低い（4m未満）場合に使用できる感知器として正しいものはどれか？", choices:["差動式スポット型のみ","定温式スポット型のみ","差動式・定温式・煙感知器など多くの種類","炎感知器のみ"], ans:2, exp:"天井高4m未満では差動式スポット型・定温式スポット型・煙感知器（光電式・イオン化式）など多くの種類が設置可能です。"},
    {cat:"実技", type:"甲4", q:"終端抵抗の役割として正しいものはどれか？", choices:["感知器の感度を調整する","回線の断線を監視する","電源電圧を安定させる","音響を調整する"], ans:1, exp:"終端抵抗は感知器回路の末端に設置し、断線が生じた場合に受信機で検出できるようにするためのものです。"},
    {cat:"実技", type:"甲4", q:"自動火災報知設備の配線について正しいものはどれか？", choices:["一般電話線を使用できる","耐熱配線または耐火配線を使用する","感知器回路は太い電線が必要","配線の色の規定はない"], ans:1, exp:"自動火災報知設備の配線（特に非常電源回路・幹線等）は耐熱配線または耐火配線を使用します。"},
    {cat:"実技", type:"甲4", q:"感知器の取付け面と感知器下端の距離として正しいものはどれか？", choices:["0.1m以内","0.3m以内","0.5m以内","1.0m以内"], ans:1, exp:"感知器の取付け面（天井面）から感知器下端までの距離は0.3m以内でなければなりません。"},
    {cat:"実技", type:"甲4", q:"自動火災報知設備の非常電源として使用できるものはどれか？", choices:["自家発電設備のみ","蓄電池設備のみ","自家発電設備・蓄電池設備・燃料電池設備","乾電池"],  ans:2, exp:"自動火災報知設備の非常電源には自家発電設備・蓄電池設備・燃料電池設備が使用できます。"},
    {cat:"構造・機能", type:"乙7", q:"漏電火災警報器の変流器（ZCT）の役割として正しいものはどれか？", choices:["電圧を変換する","漏洩電流を検出する","電流を増幅する","接地抵抗を測定する"], ans:1, exp:"変流器（ZCT：零相変流器）は電路の漏洩電流を検出し、その信号を受信機に送ります。"},
    {cat:"法令", type:"乙7", q:"漏電火災警報器の受信機の設置場所として正しいものはどれか？", choices:["点検しやすく火災等の被害を受けにくい場所","最上階","屋外","地下室"], ans:0, exp:"受信機は点検しやすく、かつ火災等の災害による被害を受けるおそれが少ない箇所に設置します。"},
    {cat:"法令", type:"乙7", q:"漏電火災警報器の設置が必要な建物の条件として正しいものはどれか？", choices:["契約電流が50A超かつ延べ面積150㎡以上の準耐火構造でない建物","契約電流が30A超かつ延べ面積100㎡以上の木造建物","全ての木造建物","延べ面積500㎡以上の全建物"], ans:0, exp:"漏電火災警報器は契約電流容量が50Aを超え、かつ延べ面積150㎡以上の準耐火構造・耐火構造でない建物などに設置義務があります。"},
    {cat:"構造・機能", type:"乙7", q:"漏電火災警報器の受信機が警報を発する漏洩電流の値として正しいものはどれか？", choices:["50mA以上","100mA以上","200mA以上","1A以上"], ans:2, exp:"漏電火災警報器は漏洩電流が200mA以上になったときに警報を発します。これ以下の電流では作動しません。"},
    {cat:"構造・機能", type:"乙7", q:"漏電火災警報器の音響装置の音圧として正しいものはどれか？", choices:["取付け面から1mで60dB以上","取付け面から1mで70dB以上","取付け面から1mで80dB以上","取付け面から1mで90dB以上"], ans:1, exp:"漏電火災警報器の音響装置の音圧は取付け面から1mの距離で70dB以上必要です。"},
    {cat:"実技", type:"乙7", q:"漏電火災警報器の点検で使用する試験器として正しいものはどれか？", choices:["加熱試験器","漏電火災警報器試験器（テストコイル等）","絶縁抵抗計","電流計"], ans:1, exp:"漏電火災警報器の作動試験にはテストコイルや専用の試験器を使用して漏洩電流を模擬的に発生させ作動を確認します。"},
    {cat:"実技", type:"乙7", q:"漏電火災警報器の変流器の取付け位置として正しいものはどれか？", choices:["引込口の電線に取付け","分電盤の内部に取付け","電気メーターの次に取付け","屋外に取付け"], ans:0, exp:"変流器は引込口の電線（引込線取付け点から近い箇所）または分電盤の電源側に取付けます。"},
    {cat:"法令", type:"乙7", q:"漏電火災警報器の定期点検の周期として正しいものはどれか？", choices:["3か月ごと","6か月ごと（機器点検）・1年ごと（総合点検）","1年ごと","2年ごと"], ans:1, exp:"漏電火災警報器の点検は他の消防用設備等と同様に機器点検が6か月ごと、総合点検が1年ごとに実施します。"},
    {cat:"構造・機能", type:"乙7", q:"漏電火災警報器が設置できない場所として正しいものはどれか？", choices:["木造建物","湿気の多い場所（雨水がかかる場所等）","事務所","共同住宅"], ans:1, exp:"漏電火災警報器の受信機や変流器は湿気の多い場所や雨水がかかるような場所には設置できません。"},
    {cat:"法令", type:"乙7", q:"乙種7類消防設備士が行える業務として正しいものはどれか？", choices:["漏電火災警報器の工事・整備・点検","漏電火災警報器の整備・点検のみ（工事は電気工事士）","全ての電気設備の工事","漏電遮断器の設置工事"], ans:1, exp:"乙種7類は甲種がないため整備・点検のみ行えます。漏電火災警報器の工事は電気工事士が行います。"},
    {cat:"法令", type:"甲4", q:"自動火災報知設備の設置が必要な特定防火対象物の延べ面積として正しいものはどれか（カラオケボックスの場合）？", choices:["延べ面積に関係なく全て","延べ面積150㎡以上","延べ面積300㎡以上","延べ面積500㎡以上"], ans:0, exp:"カラオケボックス（令別表第1(2)項ニ）は延べ面積に関係なく自動火災報知設備の設置が義務付けられています。"},

const FREE_TYPES = Object.keys(FREE_Q);
const PAID_TYPES = Object.keys(PAID_Q);

// --- 状態変数 ---
let zone = "free";
let currentType = "基礎知識";
let currentIdx = 0;
let answered = [];
let score = 0;
let unlockedTypes = new Set();
let pwError = "";
let randomMode = false;
let randomOrder = [];
let catFilter = "全て";
let weakList = {};
let sessionStats = {};
let retryWeakMode = false;

// --- ユーティリティ ---
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getRawQs(){
  const base = zone==="free" ? (FREE_Q[currentType]||[]) : (PAID_Q[currentType]||[]);
  if(retryWeakMode){
    const wIdx = weakList[currentType]||[];
    return wIdx.map(i=>base[i]).filter(Boolean);
  }
  if(catFilter==="全て") return base;
  return base.filter(q=>q.cat===catFilter);
}

function getQs(){
  const raw=getRawQs();
  if(!randomMode||randomOrder.length!==raw.length) return raw;
  return randomOrder.map(i=>raw[i]);
}

function getCats(){
  const base = zone==="free" ? (FREE_Q[currentType]||[]) : (PAID_Q[currentType]||[]);
  return [...new Set(base.map(q=>q.cat))];
}

function resetQuizState(){
  currentIdx=0; answered=[]; score=0; randomMode=false; randomOrder=[];
}

// --- ゾーン・タブ切替 ---
function switchZone(z){
  zone=z; currentType=z==="free"?"基礎知識":PAID_TYPES[0];
  catFilter="全て"; retryWeakMode=false;
  resetQuizState(); pwError=""; render();
}

function switchType(t){
  currentType=t; catFilter="全て"; retryWeakMode=false;
  resetQuizState(); render();
}

function switchPaidType(t){
  currentType=t; catFilter="全て"; retryWeakMode=false;
  resetQuizState(); pwError=""; renderPaid();
}

function switchCatFilter(cat){
  catFilter=cat; retryWeakMode=false;
  resetQuizState(); render();
}

function toggleRandom(){
  randomMode=!randomMode;
  const raw=getRawQs();
  randomOrder=randomMode?shuffleArray([...Array(raw.length).keys()]):[...Array(raw.length).keys()];
  currentIdx=0; answered=[]; score=0; render();
}

// --- 苦手リスト ---
function addWeak(type, rawIdx){
  if(!weakList[type]) weakList[type]=[];
  if(!weakList[type].includes(rawIdx)) weakList[type].push(rawIdx);
}
function removeWeak(type, rawIdx){
  if(weakList[type]) weakList[type]=weakList[type].filter(i=>i!==rawIdx);
}
function startWeakRetry(){
  const wIdx=weakList[currentType]||[];
  if(wIdx.length===0){alert("苦手問題がまだありません。問題に回答すると自動で登録されます。");return;}
  retryWeakMode=true; catFilter="全て"; resetQuizState(); render();
}
function stopWeakRetry(){
  retryWeakMode=false; resetQuizState(); render();
}

// --- UIビルダー ---
function buildCatFilter(){
  const cats=getCats();
  if(cats.length<=1) return "";
  const all=["全て",...cats];
  return `<div class="cat-filter">${all.map(c=>`<button class="cf-btn${c===catFilter?" active":""}" onclick="switchCatFilter('${c}')">${c}</button>`).join("")}</div>`;
}

function buildWeakBar(){
  const wIdx=weakList[currentType]||[];
  if(wIdx.length===0) return "";
  return `<div class="weak-bar">
    <div class="weak-bar-title">⚠️ 苦手問題 ${wIdx.length}件</div>
    <div class="weak-chips">
      ${wIdx.slice(0,8).map(i=>`<span class="weak-chip">Q${i+1}</span>`).join("")}
      ${wIdx.length>8?`<span class="weak-chip">+${wIdx.length-8}</span>`:""}
      <span class="weak-chip retry" onclick="startWeakRetry()">🔁 苦手を解く</span>
    </div>
  </div>`;
}

function buildStatsPanel(){
  const types=zone==="free"?FREE_TYPES:PAID_TYPES;
  const entries=types.filter(t=>sessionStats[t]);
  if(entries.length===0) return "";
  return `<div class="stats-panel">
    <div class="stats-title">📊 正答率（今回のセッション）</div>
    ${entries.map(t=>{
      const s=sessionStats[t];
      const pct=s.total?Math.round(s.score/s.total*100):0;
      const color=pct>=80?"#22c55e":pct>=60?"#f59e0b":"#ef4444";
      return `<div class="stats-row">
        <span class="stats-label">${t}</span>
        <div class="stats-track"><div class="stats-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="stats-val">${pct}%</span>
      </div>`;
    }).join("")}
  </div>`;
}

function buildMeta(z, total){
  const badge=`<span class="score-badge score-${z}">正解 ${score}問</span>`;
  const rand=`<button class="rand-btn${randomMode?" rand-on":""}" onclick="toggleRandom()">${randomMode?"🔀ON":"🔀"}</button>`;
  const retry=retryWeakMode?`<button class="rand-btn" onclick="stopWeakRetry()">📋 全問に戻る</button>`:"";
  return `<div class="meta"><span class="meta-l">${retryWeakMode?"⚠️苦手 ":""}問題 ${currentIdx+1} / ${total}</span><div class="meta-right">${badge}${rand}${retry}</div></div>`;
}

// --- メインレンダー ---
function render(){
  document.getElementById("zoneTabs").querySelectorAll(".ztab").forEach((b,i)=>{
    b.className="ztab";
    if(i===0&&zone==="free") b.classList.add("active-free");
    if(i===1&&zone==="paid") b.classList.add("active-paid");
  });
  zone==="free"?renderFree():renderPaid();
}

function renderFree(){
  const tabsHtml=FREE_TYPES.map(t=>`<button class="ttab${t===currentType?" active":""}" onclick="switchType('${t}')">${t}</button>`).join("");
  const qs=getQs(); const total=qs.length;
  const allDone=total>0&&answered.length===total&&answered.every(a=>a!==null);
  const content=(allDone&&currentIdx===total-1&&answered[currentIdx]!==null)?renderResult("free",qs):renderQuestion("free",qs);
  const prog=`<div class="prog-bar"><div class="prog-fill" style="width:${total?Math.round(((currentIdx+1)/total)*100):0}%"></div></div>`;
  document.getElementById("mainArea").innerHTML=`
    <div class="type-tabs">${tabsHtml}</div>
    ${buildStatsPanel()}${buildCatFilter()}${buildWeakBar()}${prog}
    ${buildMeta("free",total)}${content}
  `;
}

function renderPaid(){
  const tabsHtml=PAID_TYPES.map(t=>{
    const ul=unlockedTypes.has(t)||unlockedTypes.has("ALL");
    return `<button class="ttab${ul?" unlocked":""}${t===currentType?" active":""}" onclick="switchPaidType('${t}')">${t} ${ul?"🔓":"🔒"}</button>`;
  }).join("");
  const isUnlocked=unlockedTypes.has(currentType)||unlockedTypes.has("ALL");
  let content="";
  if(!isUnlocked){
    content=renderPwForm();
  } else {
    const qs=getQs(); const total=qs.length;
    const allDone=total>0&&answered.length===total&&answered.every(a=>a!==null);
    const prog=`<div class="prog-bar"><div class="prog-fill paid" style="width:${total?Math.round(((currentIdx+1)/total)*100):0}%"></div></div>`;
    const inner=(allDone&&currentIdx===total-1&&answered[currentIdx]!==null)?renderResult("paid",qs):`${prog}${buildMeta("paid",total)}${renderQuestion("paid",qs)}`;
    content=`<div class="unlocked-banner">🔓 ${currentType} 有料版 — 解放済み</div>${buildStatsPanel()}${buildCatFilter()}${buildWeakBar()}${inner}`;
  }
  document.getElementById("mainArea").innerHTML=`<div class="type-tabs">${tabsHtml}</div>${content}`;
}

function renderPwForm(){
  const noteUrl=NOTE_URLS[currentType]||"https://note.com";
  return `<div class="pw-card">
    <div class="pw-icon">🔒</div>
    <p class="pw-title">${currentType} 有料版</p>
    <p class="pw-sub">${currentType}類の問題50問＋解説が解放されます。<br>noteで攻略記事を確認してパスワードを入手しよう！</p>
    <a class="pw-note-btn" href="${noteUrl}" target="_blank" rel="noopener">📖 noteで記事を見る</a>
    <div class="pw-input-row">
      <input type="password" id="pwInput" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')submitPw()">
      <button onclick="submitPw()">解放</button>
    </div>
    ${pwError?`<p class="pw-err">❌ ${pwError}</p>`:""}
    <p class="pw-hint">セット購入パスワードで全類を一括解放できます</p>
  </div>`;
}

function submitPw(){
  const val=document.getElementById("pwInput").value.trim();
  if(val===PASSWORDS["SET"]){
    PAID_TYPES.forEach(t=>unlockedTypes.add(t));unlockedTypes.add("ALL");
    pwError="";resetQuizState();renderPaid();
  } else if(PASSWORDS[currentType]&&val===PASSWORDS[currentType]){
    unlockedTypes.add(currentType);
    pwError="";resetQuizState();renderPaid();
  } else {
    pwError="パスワードが違います。noteの記事をご確認ください。";renderPaid();
  }
}

function renderQuestion(z, qs){
  if(!qs||qs.length===0) return `<div class="q-card"><p class="q-text" style="color:#a1a1aa">この条件に一致する問題がありません。</p></div>`;
  const q=qs[currentIdx];
  const isAnswered=answered[currentIdx]!==undefined&&answered[currentIdx]!==null;
  const isLast=currentIdx===qs.length-1;
  const btnClass=z==="free"?"primary-free":"primary-paid";
  const typeTag=q.type?`<span class="type-tag">${q.type}</span>`:"";
  const base=zone==="free"?(FREE_Q[currentType]||[]):(PAID_Q[currentType]||[]);
  const rawIdx=retryWeakMode?((weakList[currentType]||[])[currentIdx]):base.indexOf(q);
  const isWeak=(weakList[currentType]||[]).includes(rawIdx);
  const weakTagHtml=isWeak?`<span class="weak-tag">⚠️ 苦手</span>`:"";
  const choicesHtml=q.choices.map((c,i)=>{
    let cls="c-btn"; let mark="";
    if(isAnswered){
      if(i===q.ans){cls+=" correct";mark=`<span class="c-mark">✅</span>`;}
      else if(i===answered[currentIdx]){cls+=" wrong";mark=`<span class="c-mark">❌</span>`;}
    }
    return `<button class="${cls}" onclick="answer(${i})" ${isAnswered?"disabled":""}>${i+1}. ${c}${mark}</button>`;
  }).join("");
  const noteUrl=NOTE_URLS[currentType]||"https://note.com";
  const expHtml=isAnswered?`
    <div class="exp-box">💡 ${q.exp}</div>
    ${z==="free"?`<div class="note-cta">📖 <span>${currentType}の詳しい攻略はnoteで →&nbsp;<a class="note-link" href="${noteUrl}" target="_blank" rel="noopener">攻略記事を読む</a></span></div>`:""}
  `:"";
  const navHtml=isAnswered?`
    <div class="nav-row">
      <button class="nav-btn" onclick="prevQ()" ${currentIdx===0?"disabled":""}>← 前へ</button>
      <button class="nav-btn ${btnClass}" onclick="${isLast?'showResult()':'nextQ()'}">${isLast?'結果を見る ▶':'次の問題 →'}</button>
    </div>
  `:"";
  return `<div class="q-card" id="qCard">
    <div class="tag-row"><span class="cat-tag">${q.cat}</span>${typeTag}${weakTagHtml}</div>
    <p class="q-text">${q.q}</p>
    <div class="choices">${choicesHtml}</div>${expHtml}
  </div>${navHtml}`;
}

function answer(i){
  if(answered[currentIdx]!==undefined&&answered[currentIdx]!==null) return;
  const qs=getQs(); const q=qs[currentIdx];
  if(answered.length<=currentIdx) answered.length=currentIdx+1;
  answered[currentIdx]=i;
  const correct=(i===q.ans);
  if(correct) score++;
  const base=zone==="free"?(FREE_Q[currentType]||[]):(PAID_Q[currentType]||[]);
  const rawIdx=retryWeakMode?((weakList[currentType]||[])[currentIdx]):base.indexOf(q);
  if(!correct){addWeak(currentType,rawIdx);}else{removeWeak(currentType,rawIdx);}
  render();
  setTimeout(()=>{const card=document.getElementById("qCard");if(card)card.classList.add(correct?"correct-anim":"wrong-anim");},10);
}

function nextQ(){ currentIdx++; render(); }
function prevQ(){ if(currentIdx>0){currentIdx--;render();} }
function showResult(){
  const qs=getQs();
  sessionStats[currentType]={score,total:qs.length};
  render();
}

function renderResult(z, qs){
  const total=qs.length;
  const pct=Math.round((score/total)*100);
  const msg=pct>=80?"🎉 すばらしい！合格ラインを上回っています！":pct>=60?"📚 もう少し！苦手分野を重点的に復習しましょう。":"💪 基礎から復習が必要です。note記事で一緒に学びましょう！";
  const cls=z==="free"?"free":"paid";
  const noteUrl=NOTE_URLS[currentType]||"https://note.com";
  const roadmapUrl=NOTE_URLS["ロードマップ"]||"https://note.com";
  const wCount=(weakList[currentType]||[]).length;
  const ctaHtml=z==="free"
    ?`<div class="result-cta free"><div class="result-cta-title free">📖 noteで詳しく学ぶ</div><a class="result-link" href="${noteUrl}" target="_blank" rel="noopener">・${currentType} 完全攻略記事</a><a class="result-link" href="${roadmapUrl}" target="_blank" rel="noopener">・取得ロードマップ（乙6→甲3）</a></div>`
    :`<div class="result-cta paid"><div class="result-cta-title paid">✅ 有料版クリア！他の類も挑戦してみましょう。</div></div>`;
  const weakBtn=wCount>0?`<button class="result-weak-btn" onclick="startWeakRetry()">⚠️ 苦手${wCount}問を再挑戦</button>`:"";
  return `<div class="result-wrap">
    <div class="result-circle ${cls}">
      <div class="result-num ${cls}">${score}<span style="font-size:16px;opacity:.6">/${total}</span></div>
      <div class="result-pct ${cls}">${pct}%</div>
    </div>
    <div class="result-lbl">正解率</div>
    <div class="result-msg">${msg}</div>
    ${ctaHtml}
    <div class="result-btns">
      <button class="nav-btn ${z==="free"?"primary-free":"primary-paid"}" onclick="resetQuiz()">🔄 もう一度</button>
      ${weakBtn}
    </div>
  </div>`;
}

function resetQuiz(){
  currentIdx=0; answered=[]; score=0;
  if(randomMode){const raw=getRawQs();randomOrder=shuffleArray([...Array(raw.length).keys()]);}
  render();
}

render();
</script>
</body>
</html>
